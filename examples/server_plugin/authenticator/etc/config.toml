# Authenticator Plugin Configuration

# OTP Secret Key for manual OTP input authentication
# This is a Base32 encoded secret key (recommended length: 16-32 characters)
# You can generate one using: https://www.google.com/landing/2step/ or similar tools
# Example: JBSWY3DPEHPK3PXP (16 characters)
OTPSecretKey = "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"

# OTP code validity period in seconds (default: 30, allowed: 15..300)
OTPPeriod = 30

# Number of digits in OTP code. Only 6 is supported (the login page takes six digits).
OTPDigits = 6

# QR code expiry time in seconds (default: 300)
QRCodeExpiry = 300

# Allow the same OTP code to be used more than once while it is valid (default: false).
# Off, a code already accepted is refused for the next ~90 seconds, so a code observed in
# transit cannot be replayed. Every user shares OTPSecretKey, so turn this on if several
# people may log in within the same 30-second window.
# Failed attempts are always rate limited, on the manual OTP form and on the QR flow's
# mobile verification alike (both check codes from OTPSecretKey): 5 failures from one
# address (IPv6: one /64; a whole /48 gets 15) lock it out for 15 minutes, and at most
# 30 failures are checked in any minute across all addresses. The global limit fails
# closed: while it is exhausted, nobody can log in with OTP. Because of the per-address
# lockouts, holding it exhausted takes about 90 IPv4 addresses (or 30 IPv6 /48s) every
# 15 minutes: cheap for a botnet, not possible from a single host. A warning is logged
# once per minute while it is reached. It is also the only bound on an attacker
# spread over many addresses: 30 guesses a minute against the 3 codes valid at any time
# is roughly a 12% chance of a correct guess per day (about a week expected) while
# ShowOTPSecret is off. Both follow from every user sharing one OTPSecretKey.
# OTPAllowReuse = false

# Show OTPSecretKey on the public login page so visitors can enrol it (default: false).
# Anyone who can load the page can then generate valid codes, which makes the OTP no
# longer secret. Enable it only for public demos.
# ShowOTPSecret = false

# Reverse proxies in front of nhp-server (addresses or CIDR prefixes). OTP attempts from
# one of them are rate limited by the client address in X-Forwarded-For, and access is
# opened for that address. From any other peer the header is ignored and access is opened
# for the TCP peer, so a client cannot point access at an address it does not hold.
# Leave empty when clients connect directly. Behind a proxy it must be set: otherwise
# every client shares the proxy's limit, one client can lock out all users, and access is
# opened for the proxy's address instead of the client's (a warning is logged the first
# time a loopback or private peer sends X-Forwarded-For while this is empty).
# One invalid entry disables the list.
# TrustedProxies = ["127.0.0.1"]
