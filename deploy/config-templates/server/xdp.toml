# NHP-Server eBPF/XDP ingress policy (generated by CI)
#
# This file is what opts the host into being filtered. Without it — or with
# Enabled = false, or with a RelayIPs that names no usable prefix — nhp-serverd
# attaches nothing and the host keeps the exposure it had before the filter
# existed. With it,
# nhp-serverd attaches nhp_server_xdp.o at startup and drops everything at the
# driver except two things: UDP on the NHP knock port, and SSH from the
# addresses listed here.
#
# Note what that second sentence costs: the filter also drops inbound TCP to
# any service this daemon listens on. nhp-serverd refuses to attach while the
# HTTP knock listener or an off-host metrics endpoint is enabled, rather than
# black-holing them silently.
#
# RelayIPs is the only hot-reloadable field: it is re-read whenever this file
# changes. Enabled, NhpMinFrameBytes and the ScanReport* knobs are read once, at
# startup.
#
# RelayIPs is rendered from the RELAY_IPS environment variable (a comma-
# separated list, quoted into a TOML array by scripts/generate-nhp-keys.sh).
# If any lookup fails the pipeline stops before this file is written and before
# nhp-serverd is restarted, so the running host keeps the whitelist it already
# has — an empty or private-address-less list here would lock every operator
# out of SSH, and the only way back in is to rebuild the instance (there is no
# break-glass path by design).

Enabled = ${XDP_ENABLED}

# Shortest UDP datagram accepted on the knock port from a non-relay source:
# the 240-byte NHP_KPL header of the curve cipher suite. gmsm knocks are 304
# bytes and clear it too.
#
# Applied, not just recorded: the daemon writes this value into the object's
# .rodata when it attaches. Changing it takes a restart, not a reload. The
# knock port itself is not configured here — the daemon takes it from its own
# ListenPort, so the two cannot disagree.
NhpMinFrameBytes = ${XDP_NHP_MIN_FRAME_BYTES}

# Sources allowed to reach tcp/22, and allowed to reach the knock port without
# meeting the length floor (the relay forwards short handshake packets).
#
# Entries are IPv4 host addresses or CIDR prefixes, matched by longest prefix.
# Nothing else: a hostname, an IPv6 address, an entry with a trailing comment or
# a typo like 10.0.1.300 fails the whole list, and nhp-serverd then refuses to
# attach (at startup) or keeps the whitelist it is already enforcing (on
# reload). A single bad entry is not skipped — it could be the one this host's
# SSH actually arrives from. CI always renders two: the relay's VPC private
# address, which is what SSH into this host arrives from because CI jumps
# through the relay to the server's private address, and the public address of
# relay.opennhp.org, for anything that reaches this host through the internet
# gateway instead.
#
# It renders a third, the VPC subnet, only while the relay's private address is
# unpinned (var.relay_private_ip is empty). Replacing that instance then gives
# it a new address, and a whitelist naming only the old one drops SSH from the
# new relay — which is the only path CI has for pushing a corrected whitelist.
# The subnet prefix covers the replacement, at the cost of admitting every other
# instance in that subnet to tcp/22 here. With server_open_all_ports = true (opt-in) this
# list is the only control on tcp/22; with it false the security group is the
# narrower one. Pin the address and this entry goes away.
RelayIPs = [${RELAY_IPS_TOML}]

# The knock port itself is not configured here — the daemon takes it from its
# own ListenPort (rendered from $NHP_SERVER_PORT in server/config.toml). The
# single source of truth for that port is terraform/demo's var.nhp_listen_port;
# the security group rule for udp/<port> is rendered from the same variable,
# so configuration cannot run ahead of the security group.

# [NHP-SCAN] 汇总窗口与 Top-N。启动时读一次，改了要重启 nhp-serverd。
# 每窗口日志行数恒为 2*TopN + 1，与被攻击强度无关。
ScanReportIntervalSeconds = ${XDP_SCAN_REPORT_SECONDS}
ScanReportTopN = ${XDP_SCAN_TOP_N}

# Per-packet event log. true (the default when absent) keeps it; false stops
# only that log. [NHP-STAT] / [NHP-SCAN] summaries and the filter itself are
# unaffected. Read once at startup; changing it takes a restart.
EventLogEnabled = ${XDP_EVENT_LOG_ENABLED}
