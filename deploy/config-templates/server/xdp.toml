# NHP-Server eBPF/XDP ingress policy (generated by CI)
#
# nhp-serverd attaches nhp_server_xdp.o at startup and drops everything at the
# driver except two things: UDP on the NHP knock port, and SSH from the
# addresses listed here. The whitelist is reloaded whenever this file changes;
# nothing else in it is hot-reloadable.
#
# RelayIPs is the ONLY field that reaches the kernel. It is rendered from
# ${RELAY_IPS}, resolved from nhp-relay.opennhp.org by the deploy pipeline. If
# that resolution fails the pipeline stops before this file is written and
# before nhp-serverd is restarted, so the running host keeps the whitelist it
# already has — an empty list here would lock every operator out of SSH, and
# the only way back in is to rebuild the instance (there is no break-glass
# path by design).
#
# Enabled and NhpMinFrameBytes are recorded for the operator's benefit and are
# reported, not applied: the program is attached whenever the object loads, and
# the length floor is compiled into nhp/ebpf/xdp/nhp_server_xdp.c
# (NHP_MIN_UDP_LEN). Changing the floor means rebuilding the object.

Enabled = ${XDP_ENABLED}

# Shortest UDP datagram accepted on the knock port from a non-relay source:
# the 240-byte NHP_KPL header of the curve cipher suite. gmsm knocks are 304
# bytes and clear it too.
NhpMinFrameBytes = ${XDP_NHP_MIN_FRAME_BYTES}

# Sources allowed to reach tcp/22, and allowed to reach the knock port without
# meeting the length floor (the relay forwards short handshake packets).
RelayIPs = ["${RELAY_IPS}"]
