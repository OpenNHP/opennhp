# http server config

# EnableHttp: true: turn on http server, false: shutdown http server.
# EnableTLS: whether to use TLS certificates for hosting https server.
# TLSCertFile: certificate file path.
# TLSKeyFile: key file path.
# to update http changes, you need to restart the http server by changing "EnableHttp" to "false" and then switch it back to "true".
EnableHttp = true
EnableTLS = true
HttpListenIp = "0.0.0.0"    # empty for ipv4 + ipv6, "0.0.0.0" for ipv4 only, "127.0.0.1" for local ipv4 access only
HttpListenPort = 443
TLSCertFile = "cert/cert.pem"
TLSKeyFile = "cert/cert.key"

# /storage API: ZTDO upload by nhp-db (online mode), anonymous download by agents.
# Upload and metadata require a request signed with the key of an nhp-db
# listed in db.toml (nhp-db does this automatically). Read when the http server starts.
# The signature covers the request path, so a reverse proxy in front must not rewrite
# /storage paths (e.g. strip a prefix), or every signed upload is refused with 401.
# EnableStorage: false removes the /storage routes entirely (default true).
# StorageMaxUploadMB: largest accepted upload in MiB (default 20480).
# StorageMinFreeMB: free space in MiB an upload must leave on the upload volume (default 1024).
# StorageMaxConcurrentUploads: uploads in progress at once (default 4).
# EnableStorage = true
# StorageMaxUploadMB = 20480
# StorageMinFreeMB = 1024
# StorageMaxConcurrentUploads = 4

# TrustedProxies: the network origins (IPv4/IPv6 addresses or CIDR prefixes)
# whose X-Forwarded-For / X-Real-IP headers are believed. The knock source IP
# is what nhp-server asks the AC to open a firewall rule for, so a caller that
# can set it can open the resource for an address of their choosing.
# Leave it empty (the default) unless this listener is bound where ONLY a
# reverse proxy can reach it AND that proxy OVERWRITES the forwarding headers
# (nginx: proxy_set_header X-Forwarded-For $remote_addr -- NOT
# $proxy_add_x_forwarded_for, which carries the client's own value through).
# With the list empty the headers are ignored and the TCP peer address is used.
# An entry that does not parse refuses the whole list and the HTTP server does
# not start, rather than leaving a trust list nobody wrote.
# Like the other fields here, a change takes effect only when the HTTP server
# restarts (set EnableHttp = false, then back to true). Editing the file alone
# does not revoke trust from a running listener; the daemon logs a Critical
# line when the configured list and the running one disagree.
TrustedProxies = []
