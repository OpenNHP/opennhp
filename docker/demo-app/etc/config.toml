# Demo App configuration for the docker-compose stack.
#
# This file is bind-mounted from the host (./demo-app/etc/config.toml
# -> /demo-app/etc/config.toml), so edits are picked up on container
# restart. The plugin running inside nhp-server reaches the Demo App
# over the docker network at http://demo-app:8088.

# ListenAddr (-): HTTP listen address. 8088 is published to the host
# via docker-compose.
listenAddr = ":8088"

# DbPath: SQLite database for user accounts and NHP key metadata.
# Mounted on the demo-app/data/ volume so user data survives restarts.
dbPath = "/demo-app/data/demo.db"

# SessionSecret: cookie-store signing key. In production this MUST be
# 32+ random bytes committed through your secret manager; the dev
# default in code will be used if left empty. The value below is fine
# for a local demo but DO NOT reuse it outside this stack.
sessionSecret = "${DEMO_APP_SESSION_SECRET}"

# InternalApiKey: shared secret for the plugin <-> demo-app /internal
# endpoints. Must match the value in
# docker/nhp-server/plugins/demo-app/etc/config.toml.
internalApiKey = "${DEMO_APP_INTERNAL_API_KEY}"

# OtpTTLMinutes: lifetime of OTP codes generated by RequestOTP.
otpTTLMinutes = 5

# LogLevel: 0 silent, 1 error, 2 info, 3 audit, 4 debug, 5 trace.
logLevel = 5

# SMTP — console mode prints OTPs to stdout with a [demoapp-otp] prefix.
# Set mode = "smtp" and fill in the host/port/credentials below to
# switch to real email delivery.
[smtp]
mode = "console"
host = ""
port = 587
username = ""
password = ""
from = "noreply@opennhp.demo"
subject = "Your OpenNHP Demo verification code"
codeInSubject = true

# OIDC — keep enabled = false for the local demo. Set true and fill in
# issuerUrl/clientId/clientSecret/redirectUrl to enable Google/GitHub/
# Keycloak/etc. login.
[oidc]
enabled = false
issuerUrl = ""
clientId = ""
clientSecret = ""
redirectUrl = ""
scopes = "openid email profile"

# nhp — public-facing values served to the browser for js-agent. The
# relayUrl points at nhp-relay in the docker network; the
# serverPublicKey is the base64 Curve25519 public key of nhp-server.
[ nhp ]
relayUrl = "http://nhp-relay:8080"
# nhp_server_public_key from the opennhp/demo secret (rendered by
# scripts/generate-nhp-keys.sh at deploy time).
serverPublicKey = "${NHP_SERVER_PUBLIC_KEY}"
authServiceId = "demo-app"
cipherScheme = "curve25519"