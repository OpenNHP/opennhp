# sources.conf for the XDP attack stats collector.
#
# Read by xdpstats-collect.sh on the relay host. One source per line, in the
# form:  <name> <ssh_user> <host> <log_dir>
#
# The collector iterates sources and runs `ssh <user>@<host> list` followed by
# `ssh <user>@<host> get <date>` per day. The remote forced-command script
# (nhp-xdplog-export.sh, installed by deploy-server) accepts only those two
# commands; everything else is refused at authorized_keys.
#
# Two sources: nhp-server and nhp-ac. Each writes one daily event log named
# nhp_<name>_xdp-YYYY-MM-DD.log, and the collector derives that prefix from
# <name>, so <name> MUST be "server" or "ac". A new source needs a parser
# that understands its log shape (endpoints/xdplog-report/parse.go), its own
# forced-command export script and authorized_keys entry on that host, and a
# line here.
#
# <host> is the host's PRIVATE IP (SERVER_PRIVATE_IP / AC_PRIVATE_IP, both
# rendered by deploy-xdpstats). The SSH keypair (stats_collector_ssh_*) only
# has the forced command on the remote side. For the server, both the SSH
# whitelist (xdp.toml) and the security group already include the relay
# address; the AC security group admits tcp/22 from the relay SG.
#
# <log_dir> is the daemon's logs directory; the file name inside it is
# nhp_server_xdp-YYYY-MM-DD.log or nhp_ac_xdp-YYYY-MM-DD.log (the export
# scripts filter out any evaluate/audit siblings).

server ec2-user ${SERVER_PRIVATE_IP} /home/ec2-user/nhp-server/logs
ac ec2-user ${AC_PRIVATE_IP} /home/ec2-user/nhp-ac/logs
