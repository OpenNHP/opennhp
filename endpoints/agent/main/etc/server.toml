# nhp-agent server-peer configuration.
#
# Each [[Servers]] block declares ONE logical nhp-server identity (one
# pubkey) and lists 1..N physical instances that share that pubkey.
# Multi-instance entries enable load-balancing across an nhp-server
# cluster (e.g. multiple replicas behind a load balancer); the cookie
# handshake works across the cluster because every replica is
# configured with the same CookieSigningKeyBase64.
#
# The schema is shared with nhp-ac and nhp-db (see
# nhp/common/clusterconfig) so the same [[Servers]] block can be copied
# between peer tables. nhp-agent is the most feature-complete consumer:
# it honours every field below — LoadBalance picks an instance per
# knock, StickyInstance keeps the KNK/RKN pair on the same replica.
#
# Per-field reference:
#   Name                   — cluster identifier, referenced from resource.toml's
#                            Cluster = "..." field. Allowed chars: [a-zA-Z0-9._-],
#                            max 64. REQUIRED for nhp-agent.
#   PubKeyBase64           — the server's public key, matching the cipher scheme
#                            configured in config.toml's DefaultCipherScheme:
#                              DefaultCipherScheme = 0  →  Curve25519 key (32-byte base64)
#                              DefaultCipherScheme = 1  →  SM2 key (64-byte base64)
#   ExpireTime             — epoch seconds; peer-key validation fails after this
#   LoadBalance            — "weighted-random" (default), "random", "round-robin"
#   StickyInstance         — bool; default true. When true, a KnockTarget that
#                            picks instance X for its KNK reuses X for the
#                            follow-up RKN, so cookie verification stays put.
#                            Setting false spreads retries across the cluster's
#                            instances (only safe with stateless cookies).
#
# Per-instance fields (under [[Servers.Instances]]):
#   Host           — DNS name (preferred); resolves at send time
#   Ip             — static IP (used if Host is empty)
#   Port           — UDP port (required, > 0)
#   Weight         — relative weight for weighted-random; default 1
#
# ─── Local docker environment (default) ───────────────────────────────
# This is the peer table shipped by `make agentd` into
# release/nhp-agent/etc/server.toml. It targets the LOCAL docker-compose
# environment: the agent binary runs on the host and knocks the
# containerized nhp-server, whose UDP port is published to the host by
# docker/docker-compose.yaml as "62206:62206/udp". Hence Ip = 127.0.0.1
# and Port = 62206 below.
#
# Start the matching server stack with:
#   cd docker && docker-compose up -d nhp-server nhp-ac nhp-relay
# then run:
#   ./release/nhp-agent/nhp-agentd register
# (the register / run commands read etc/server.toml for the peer table).
#
# The PubKeyBase64 below is the SM2 (gmsm) public key of the server in
# docker/nhp-server/etc/config.toml (DefaultCipherScheme = 1). The
# commented Curve25519 line immediately after it is the SAME key in
# curve form — uncomment it and comment the SM2 line if you flip the
# server's DefaultCipherScheme to 0 (curve25519).
#
# Public demo: for the live demo cluster peer blocks (server.opennhp.org
# / server2.opennhp.org) see the "Demo nhp-server configuration" panel at
# https://reg.opennhp.org/. Note that native nhp-agentd is UDP-direct
# only (no relay transport) and the demo's 62206/udp is NOT exposed to
# the public internet — the browser demo reaches the server via the
# 443/TLS relay. So this local-docker peer is the one to use for local
# development; the public-demo TOML is reference material unless your
# network can reach the server's UDP port.
#
# Key rotation: the demo nhp-server keys are re-generated whenever the
# deploy-demo-v2 workflow runs with regenerate_keys=yes (and may otherwise
# change between deploys). A stale PubKeyBase64 will fail peer validation
# at the server. Always re-fetch the [[Servers]] block from
# https://reg.opennhp.org/ before pointing a native agent at the demo;
# do NOT cache an old copy. (This local-docker peer is unaffected — its
# key is tied to docker/nhp-server/etc/config.toml, not the demo deploy.)
[[Servers]]
Name = "default"
PubKeyBase64 = "4/p0mIknwmVIMocRLQKil7xIthgEdZNncv9UagiBaK2kpcH7i4hEtZjpcHox+Bn7xdV+rBKNbKlV9ye6V1VCLA=="
#PubKeyBase64 = "UuUPfVS2iBKf3OKluBIhQsbz2Yi81+/s+Yeh5MBC8Sg="
ExpireTime = 1924991999
LoadBalance = "weighted-random"

  [[Servers.Instances]]
  Ip   = "127.0.0.1"
  Port = 62206
