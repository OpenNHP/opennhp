# OpenNHP demoapp config (generated by CI from deploy/config-templates/demoapp/config.toml)
#
# Deployed to the relay host alongside nhp-relayd. nginx proxies
# demo.opennhp.org → 127.0.0.1:8081 (see deploy/nginx/demoapp.conf.template).
#
# Auto-generated secrets: KeyEnvelopeKey and SessionKey carry the
# placeholder marker, so the demoapp fills them on first boot and persists
# the values to etc/.demoapp-autogen.json (see demoapp/autogen.go).
# Restarting reuses the sidecar; losing it bricks every stored user key.
# The data/ dir (SQLite DB) is persistent on the EC2 host.

ListenAddr = ":8081"

# SQLite database path. Relative to the service WorkingDirectory
# (/home/ec2-user/nhp-demoapp), so data/ sits next to the binary and
# survives restarts.
DBPath = "data/demo.db"

# 32+ byte random key used to sign the session cookie. Auto-generated on
# first boot when the placeholder marker is present.
SessionKey = "REPLACE_WITH_RANDOM_32_BYTES"

# Mark the session cookie Secure so the browser only sends it over TLS.
# The public demo is HTTPS-only (demo.opennhp.org), so this is true in
# prod. Local dev over http://localhost leaves it unset (false) so the
# browser still attaches the cookie.
SecureCookies = true

# 32-byte AES-256 master key (base64-encoded) used to wrap each user's
# NHP private key at rest. Auto-generated on first boot.
KeyEnvelopeKey = "REPLACE_WITH_32_BYTE_BASE64"

# Default cipher scheme for non-interactive paths (e.g. OIDC upsert
# before the user reaches the complete-registration view). Interactive
# registration overrides it per server + scheme. The production relay
# runs Curve25519 (cipherScheme=0 in relay/config.toml), so curve25519
# is the default here.
CipherScheme = "curve25519"

# HTTP relay endpoint the demoapp SERVER uses to talk to the relay.
# Same host → loopback avoids a TLS round-trip through nginx.
RelayUrl = "http://127.0.0.1:8443/relay"

# HTTP relay endpoint the SPA's BROWSER uses. The browser is remote, so
# it goes through the public nginx vhost on relay.opennhp.org.
PublicRelayUrl = "https://relay.opennhp.org/relay"

# web/dist is embedded in the binary at build time (webdist tag); this
# field is unused in the deployed binary but kept for operator overrides.
WebDistDir = "web/dist"

# Upstream nhp-server clusters. Each entry declares BOTH public keys
# (derived from the nhp-server's single private key via `keygen --both`)
# so the registration page can offer either cipher scheme independently.
# RelayRegisteredScheme names which key the relay registered the server
# under — that key drives the relay routing fingerprint. The production
# relay registers the Curve25519 key (relay/config.toml cipherScheme=0,
# PubKeyBase64=${NHP_SERVER_PUBLIC_KEY}), so a gmsm knock routes via
# relayPublicKey = the Curve25519 key.
#
# Cluster 1 and cluster 2 are independent nhp-server identities; the
# demoapp registers each user's key against the server they pick.

[[Servers]]
Name                  = "Cluster 1"
ServiceId             = "example"
OrganizationId        = "opennhp.org"
Sm2PublicKey          = "${NHP_SERVER_SM2_PUBLIC_KEY}"
Curve25519PublicKey   = "${NHP_SERVER_PUBLIC_KEY}"
RelayRegisteredScheme = "curve25519"

[[Servers]]
Name                  = "Cluster 2"
ServiceId             = "example"
OrganizationId        = "opennhp.org"
Sm2PublicKey          = "${NHP_SERVER2_SM2_PUBLIC_KEY}"
Curve25519PublicKey   = "${NHP_SERVER2_PUBLIC_KEY}"
RelayRegisteredScheme = "curve25519"

# Application-side OIDC Relying Party. Independent of the nhp-server
# ASP plugin (which stays on the basic plugin for NHP-side flows).
# Disabled for the public demo (password auth + self-registration).
[[OIDC]]
Enabled      = false
IssuerURL    = "https://accounts.google.com"
ClientID     = "demoapp-client-id"
ClientSecret = "demoapp-client-secret"
RedirectURL  = "https://demo.opennhp.org/api/auth/oidc/callback"

# Application-side OAuth 2.0 login provider (GitHub). GitHub does not
# implement OIDC (no discovery endpoint, no id_token), so it has its own
# handler (demoapp/auth_github.go) that uses the /user API for identity.
# Disabled by default; set Enabled = true and fill the placeholders via
# the deploy pipeline. ClientID/RedirectURL render from GitHub Actions
# Variables; ClientSecret renders from a GitHub Actions Secret.
[[OAuth]]
Enabled      = ${GH_OAUTH_ENABLED}
Provider     = "github"
ClientID     = "${GH_OAUTH_CLIENT_ID}"
ClientSecret = "${GH_OAUTH_CLIENT_SECRET}"
RedirectURL  = "${GH_OAUTH_REDIRECT_URL}"

# Catalog of protected resources the SPA can show. The id MUST match what
# the nhp-server basic plugin returns from ListService; the rest is UI
# metadata only. ServerName scopes each resource to its cluster.
[[Resources]]
Id         = "demo"
Title      = "OpenNHP Protected Demo (Cluster 1)"
URL        = "https://ac.opennhp.org"
ACHost     = "ac.opennhp.org"
ServerName = "Cluster 1"

[[Resources]]
Id         = "demo"
Title      = "OpenNHP Protected Demo (Cluster 2)"
URL        = "https://ac2.opennhp.org"
ACHost     = "ac2.opennhp.org"
ServerName = "Cluster 2"
