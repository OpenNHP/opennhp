# Docker demoapp config. The container runs the binary against this file
# (see docker/Dockerfile.demoapp).
#
# Auto-generated secrets: KeyEnvelopeKey, SessionKey, and ServerPublicKey
# are filled in by the demoapp on first boot when they carry the
# placeholder marker ("REPLACE_*" or "CHANGE_ME"). Generated values
# persist in the sidecar file etc/.demoapp-autogen.json so restarts keep
# the same master key (re-generating would orphan every stored NHP
# private key). For production, pre-generate the sidecar in your CI
# pipeline and mount it read-only.

ListenAddr = ":8081"

# Path to the SQLite database file (created on first run).
DBPath = "/app/data/demo.db"

# 32+ byte random key used to sign the session cookie. Auto-generated on
# first boot when the placeholder marker is present.
SessionKey = "REPLACE_WITH_RANDOM_32_BYTES"

# 32-byte AES-256 master key (base64-encoded) used to wrap each user's
# NHP private key at rest. Auto-generated on first boot. Losing this key
# (or the sidecar that stores it) bricks every user account. For local
# docker, the auto-generated sidecar under ./demoapp/etc/ is fine; for any
# serious deployment, source it from a secret manager.
KeyEnvelopeKey = "REPLACE_WITH_32_BYTE_BASE64"

# Cipher scheme used for NHP. Must match the nhp-server ASP plugin.
# The bundled docker stack ships nhp-relay at GMSM (cipherScheme=1 in
# relay's config.toml) and nhp-server keys are SM2 64-byte X||Y, so the
# demoapp must also use gmsm or the SPA will hand a 64-byte key to the
# X25519 path and every packet will fail with "uCoordinate expected
# Uint8Array of length 32, got length=64".
CipherScheme = "gmsm"

# HTTP relay endpoint the demoapp SERVER uses to talk to the relay.
# Inside docker compose the relay is reachable by its service name.
RelayUrl = "http://nhp-relay:8080/relay"

# HTTP relay endpoint the SPA's BROWSER uses to talk to the relay. The
# SPA runs inside the demoapp container but the browser is on the host,
# so it can't resolve "nhp-relay" — it must use a host-reachable URL.
# In docker compose the relay's port 8080 is mapped to host:8080, so
# "http://localhost:8080/relay" works from any browser on the host.
PublicRelayUrl = "http://localhost:8080/relay"

# Base64-encoded public key of the nhp-server instance. This mirrors
# the [[Servers]] PubKeyBase64 entry in docker/nhp-relay/etc/config.toml
# verbatim — the relay registers the same key and forwards all packets
# to nhp-server using it for ECDH. Pre-populated here so demoapp boots
# without an HTTP probe to /servers, and so the cipher scheme stays in
# sync with whatever the relay was actually configured with.
ServerPublicKey = "4/p0mIknwmVIMocRLQKil7xIthgEdZNncv9UagiBaK2kpcH7i4hEtZjpcHox+Bn7xdV+rBKNbKlV9ye6V1VCLA=="

# ASP service id (basic plugin identifier). Must match the ASP plugin
# the nhp-server is running.
ServiceId = "example"

# Organization id surfaced as the agent's orgId in NHP packets.
OrganizationId = "opennhp.org"

# web/dist is embedded in the binary at build time; this field is unused
# in the Docker image but kept so operators can override.
WebDistDir = "/app/web/dist"

# Application-side OIDC Relying Party. Independent of the nhp-server
# ASP plugin (which stays on the basic plugin for NHP-side flows).
[[OIDC]]
Enabled = false
IssuerURL    = "https://accounts.google.com"
ClientID     = "demoapp-client-id"
ClientSecret = "demoapp-client-secret"
RedirectURL  = "http://localhost:8081/api/auth/oidc/callback"

# Catalog of protected resources the SPA can show. The id MUST match what
# the nhp-server basic plugin returns from ListService; the rest is UI
# metadata only.
[[Resources]]
Id     = "demo"
Title  = "OpenNHP Protected Demo"
URL    = "https://localhost"
ACHost = "localhost"