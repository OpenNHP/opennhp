# NHP-AC base config (generated by CI)

ACId = "demo-ac"
DefaultIp = "${AC_PRIVATE_IP}"
PrivateKeyBase64 = "${NHP_AC_PRIVATE_KEY}"
DefaultCipherScheme = 0
IpPassMode = 0
LogLevel = 3
AuthServiceId = "example"
ResourceIds = ["demo"]
# AC access control mode:
#   0 = iptables/ipset (legacy)
#   1 = eBPF / XDP + TC egress (default for demo deploy)
# The demo pipeline ships this value as 1; the iptables mode is retained
# as a fallback for non-demo deployments.
FilterMode = 1
