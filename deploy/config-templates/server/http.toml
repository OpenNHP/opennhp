# NHP-Server HTTP config (generated by CI)
#
# The HTTP surface is intentionally DISABLED on the public demo.
#
# EnableHttp is the single gate in endpoints/server/config.go (updateHttpConfig)
# that decides whether nhp-serverd binds an HTTP listener at all. With it false
# the daemon never opens 127.0.0.1:8443, so the retired demo login page
# (/plugins/example?action=login&resid=demo) has no backend. This pairs with the
# torn-down nginx vhost (deploy-demo-v2 deploy-server job) and the removed
# tcp/443 security-group rule (terraform/demo/security-groups.tf).
#
# The NHP UDP knock service is driven by config.toml and is unaffected.
#
# The remaining fields are kept only so re-enabling is a one-line change; they
# have no effect while EnableHttp = false.

EnableHttp = false
EnableTLS = false
HttpListenIp = "127.0.0.1"
HttpListenPort = 8443

# TrustedProxies: the origins whose X-Forwarded-For / X-Real-IP headers the
# HTTP knock module believes when deciding the source address it asks the AC to
# open a rule for. Empty means none, so the TCP peer is used and a caller
# cannot choose the address (CWE-348).
#
# Kept empty even though deploy/nginx/server.conf.template would qualify
# (it sets X-Forwarded-For to $remote_addr rather than appending): EnableHttp
# is false here and that vhost is torn down, so there is no proxy in front of
# this listener to trust. If the demo login page is ever re-enabled -- which
# means restoring the tcp/443 ingress, the demologin CNAME and the vhost
# together, see CLAUDE.md -- set this to ["127.0.0.1"] in the same change,
# because HttpListenIp is loopback and nginx is same-host.
TrustedProxies = []
