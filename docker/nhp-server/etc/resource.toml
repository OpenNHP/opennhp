# List resources and their sub-fields here

# syntax ["{AuthServiceId}"]
# AuthServiceId: id of the authentication and authorization service provider.
# PluginPath: path of plugin to implement auth logic.
["example"]
PluginPath = "example/example.so"

# demo-app ASP — backed by demo-app-plugin. AuthServiceId MUST match
# the `nhp.authServiceId` configured in demo-app/etc/config.toml and the
# `AuthServiceId` field in plugins/demo-app/etc/config.toml.
["demo-app"]
PluginPath = "demo-app/demo-app.so"
