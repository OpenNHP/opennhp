# sources.conf for the XDP attack stats collector.
#
# Read by xdpstats-collect.sh on the relay host. One source per line, in the
# form:  <name> <ssh_user> <host> <log_dir>
#
# The collector iterates sources and runs `ssh <user>@<host> list` followed by
# `ssh <user>@<host> get <date>` per day. The remote forced-command script
# (nhp-xdplog-export.sh, installed by deploy-server) accepts only those two
# commands; everything else is refused at authorized_keys.
#
# v1 ships with exactly one line, the nhp-server source. The AC writes a
# different log shape (per-flow accept/deny files, not nhp_server_xdp-*) and
# the analyzer at endpoints/xdplog-report/parse.go does not understand it
# yet. Adding the AC is a future change that needs:
#   1. parse.go support for the AC log line shape
#   2. a new SSH keypair / authorized_keys entry on the AC host
#   3. a new <name> <user> <host> <log_dir> line here
#
# <host> is the nhp-server's PRIVATE IP. The relay reaches the server via
# ProxyJump, and the SSH keypair (stats_collector_ssh_*) only has the
# forced command on the server side; both the SSH whitelist (xdp.toml) and
# the security group already include the relay address, so no firewall
# change is needed.
#
# <log_dir> is the daemon's logs directory; the file name inside it is
# nhp_server_xdp-YYYY-MM-DD.log (with no evaluate/audit siblings; the
# export script filters those out).

server ec2-user ${SERVER_PRIVATE_IP} /home/ec2-user/nhp-server/logs
