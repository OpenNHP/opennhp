# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Test Code on Ubuntu

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache-dependency-path: |
          nhp/go.sum
          endpoints/go.sum
          demoapp/go.sum

    - name: Test optional firewall helper
      run: |
        bash -n docker/harden_nhp_server_udp.sh
        python3 docker/test_harden_nhp_server_udp.py

    - name: Build
      run: make

    # `make` does not touch the eBPF C sources, so without this step a
    # compile error in nhp_ebpf_xdp.c / tc_egress.c / nhp_server_xdp.c only
    # surfaces when deploy-demo-v2 runs `make ebpf-objs` at deploy time.
    - name: Build eBPF objects
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libbpf-dev
        make ebpf-objs
        test -s release/nhp-ac/etc/nhp_ebpf_xdp.o
        test -s release/nhp-ac/etc/tc_egress.o
        test -s release/nhp-server/etc/nhp_server_xdp.o

    # The demoapp module is not built by `make` (it ships via the docker
    # image), so gate it explicitly: a compile / vet / gofmt failure here
    # is caught before merge instead of at deploy time.
    - name: Build demoapp
      working-directory: demoapp
      run: |
        go mod download
        go build ./...

    - name: Vet + format + test demoapp
      working-directory: demoapp
      run: |
        go vet ./...
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt found unformatted files:"
          echo "$unformatted"
          exit 1
        fi
        go test ./...

    # Type-check + build the SPA so a TypeScript regression (e.g. an unused
    # local under noUnusedLocals, or a broken @opennhp/agent import) is
    # caught at PR time rather than at docker-image build time. The build
    # script runs `tsc --noEmit && vite build` (review #7).
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          demoapp/web/package-lock.json
          endpoints/js-agent/package-lock.json

    - name: Build SPA (demoapp web)
      working-directory: demoapp/web
      run: |
        # Build the local js-agent SDK so the @opennhp/agent import resolves
        # for both tsc and vite (mirrors Dockerfile.demoapp stage 1).
        cd ../../endpoints/js-agent
        npm ci --no-audit --no-fund
        npm run build
        cd -
        # Install SPA deps FIRST. `npm ci` wipes node_modules, so the
        # SDK copy has to land after it — otherwise the aliased import
        # in vite.config.ts has nothing to resolve to during `npm run
        # build` (which runs `tsc --noEmit && vite build`).
        npm ci --no-audit --no-fund
        mkdir -p node_modules/@opennhp/agent
        cp -r ../../endpoints/js-agent/dist node_modules/@opennhp/agent/dist
        cp ../../endpoints/js-agent/package.json node_modules/@opennhp/agent/package.json
        npm run build

    # govulncheck scans the demoapp module's dependency graph for known
    # advisories (e.g. the go-jose CVE-2025-27144 that prompted the
    # v4.0.5 bump in review #1). Advisory only (continue-on-error):
    # govulncheck also reports Go standard-library advisories that track
    # the runner's Go patch version, not this PR's code, so a hard gate
    # would block unrelated PRs on toolchain churn.
    - name: Govulncheck demoapp (advisory)
      continue-on-error: true
      working-directory: demoapp
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        "$(go env GOPATH)/bin/govulncheck" ./... || true


    - name: Lint nhp
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=5m
        working-directory: nhp

    - name: Lint endpoints
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=5m
        working-directory: endpoints

    - name: Run tests with coverage
      run: |
        cd nhp
        PKGS=$(go list ./... | grep -v 'wasm/policy')
        COVERPKG=$(echo "$PKGS" | paste -sd,)
        go test -coverpkg="$COVERPKG" -coverprofile=coverage.out -covermode=atomic $PKGS
        cd ../endpoints
        go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

    # The race detector is a separate run from the coverage one: the DHP
    # console hands each request its own goroutine, so the agent's shared
    # caches are only ever exercised concurrently in tests, and an
    # unsynchronized map there is a Go runtime fatal error (not a panic —
    # gin.Recovery() cannot catch it and the process exits). Coverage mode
    # does not detect that; -race does. Same package selection as
    # `make test-race`.
    - name: Run tests with the race detector
      run: |
        cd nhp
        go test -race $(go list ./... | grep -v 'wasm/policy')
        cd ../endpoints
        go test -race ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./nhp/coverage.out,./endpoints/coverage.out
        flags: unittests
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The kernel is the only thing that can accept or reject an eBPF object, and
  # on the AC a rejected object is an outage: nhp-acd cannot start, the
  # fail-closed backstop keeps tcp/443 shut, and the demo is dark. The build
  # job above only proves the objects *compile*; this one proves the kernel
  # *accepts* them, by loading all three the way the daemons load them and
  # running them against packets.
  #
  # It runs as root, because a load without CAP_BPF is refused with EPERM and
  # the load tests used to skip in that case -- which is exactly how a
  # verifier rejection could reach a deploy unnoticed. The tests now fail
  # instead of skipping when the process holds the privilege (see
  # requireCaps in nhp/utils/ebpf/privileged_linux_test.go), so a rejected
  # object fails this job with the verifier log in the output.
  ebpf-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache-dependency-path: nhp/go.sum

    - name: Install the eBPF toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libbpf-dev
        # bpftool is the kernel's own loader and prints the verifier log. It
        # is not in every Ubuntu release's archive, so it is optional here:
        # the load tests below exercise the same objects either way.
        sudo apt-get install -y bpftool || \
          echo "::notice::bpftool is not available on this runner; the load tests below are the gate"

    - name: Build the eBPF objects
      run: make ebpf-objs

    # The programs are loaded, not attached, but a load still needs a bpffs to
    # pin the maps into.
    - name: Mount bpffs
      run: sudo mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf

    - name: Load every object with bpftool
      run: |
        set -euo pipefail
        if ! command -v bpftool >/dev/null 2>&1 && [ ! -x /usr/sbin/bpftool ]; then
          echo "::notice::bpftool is not installed; skipping the bpftool load"
          exit 0
        fi
        load() {
          local obj="$1" name="$2"
          echo "::group::$obj"
          # A pin directory of its own, so this load cannot touch the pins a
          # running daemon owns. `prog loadall` takes a directory: the
          # programs and the maps are pinned inside it.
          sudo rm -rf "/sys/fs/bpf/nhp-verify/$name"
          sudo mkdir -p "/sys/fs/bpf/nhp-verify/$name"
          sudo bpftool prog loadall "$obj" "/sys/fs/bpf/nhp-verify/$name"
          sudo rm -rf "/sys/fs/bpf/nhp-verify/$name"
          echo "::endgroup::"
        }
        load release/nhp-ac/etc/nhp_ebpf_xdp.o ac-xdp
        load release/nhp-ac/etc/tc_egress.o ac-tc
        load release/nhp-server/etc/nhp_server_xdp.o server-xdp

    - name: Run the eBPF tests with CAP_BPF
      working-directory: nhp
      run: |
        set -euo pipefail
        go mod download
        # Root holds CAP_BPF and CAP_NET_ADMIN, so the load tests do not skip:
        # a kernel that refuses one of the objects fails the job here, with
        # the verifier log in the output.
        sudo env "PATH=$PATH" "HOME=/root" \
          "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
          go test ./utils/ebpf/... -v -count=1 2>&1 | tee /tmp/ebpf-tests.log
        # A load test that skipped proved nothing: this job exists to have the
        # kernel accept the objects, so the tests that load them have to have
        # run and passed. (Other tests may skip for an unrelated reason --
        # a socket the runner will not let us bind -- so only these are
        # required.)
        for t in \
          TestAcFilterAnswersTheHostsOwnPings \
          TestAcEgressProgramRecordsTheHostsOwnFlow \
          TestAcFilterKeepsTheKnockedEchoReply \
          TestAcFilterAdmitsDespiteALapsedPortScopedKnock \
          TestServerEngineLoadAttachesToLoopback
        do
          if ! grep -q -- "--- PASS: $t" /tmp/ebpf-tests.log; then
            echo "::error::$t did not run and pass; the objects were not exercised"
            exit 1
          fi
        done
        # Anything else that skipped is worth seeing, but it is not this
        # job's business.
        grep -- '--- SKIP' /tmp/ebpf-tests.log || true
